name: "Apollo Cookie Refresh (Self-Hosted)"

on:
  # SCHEDULE DISABLED 2026-09-04: cookie extraction can't work on CI — background jobs cannot
  # decrypt Chrome's cookie store on macOS (needs Keychain/GUI). Every scheduled run failed with
  # "No Apollo cookies found (or all encrypted)". REPLACED by apollo_api_recruiters.py which uses
  # the APOLLO_API_KEY (no cookies, no TTL, no browser, no ban). Manual dispatch kept as fallback.
  # schedule:
  #   - cron: "0 14 */5 * *"
  workflow_dispatch: {}

# Runs on self-hosted runner (your laptop with Chrome logged into Apollo)
jobs:
  refresh-cookies:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Extract Apollo cookies from Chrome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install cryptography 2>/dev/null || true
          python3 scripts/extract_apollo_cookies.py

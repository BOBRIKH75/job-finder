name: "Hot Reply Alerts (phone push)"

# Every 30 min: scan Bob's inbox for HOT recruiter replies (interview / RTR / rate) and
# push a phone notification via ntfy so he never misses a time-sensitive one. Dedups so
# each reply alerts only once. Cloud — no laptop needed.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: agent

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alert on hot recruiter replies
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -u scripts/alert_hot_replies.py --days 2
      - name: Persist alert dedup
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Alert Bot"
          git add agent/data/alerted_replies.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "alert: dedup state [skip ci]"
          git pull --rebase --autostash || true
          git push || true

name: Refresh Dice Cookies (Auto)

# Keeps DICE_COOKIES fresh so the Dice apply flow never hits login_redirect.
# Dice session cookies expire over time; this refreshes the secret automatically.
on:
  schedule:
    - cron: "0 12 */3 * *"   # every 3 days, 6 AM MT (before the apply schedules)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: self-hosted   # same machine that holds the logged-in .dice-profile
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - name: Refresh DICE_COOKIES secret from freshest source
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 << 'EOF'
          """Refresh DICE_COOKIES from the freshest available source:
             1) agent/data/dice_cookies.json — saved (decrypted) by dice_apply.py after each
                successful login/run; ALWAYS fresh + already in Playwright format. Preferred.
             2) Chrome's SQLite Cookies DB (dice.com host) — fallback.
             Filters to dice.com cookies only (fits GitHub's secret size limit), base64-encodes,
             and updates the DICE_COOKIES secret via gh.
          """
          import json, os, base64, subprocess, sqlite3, shutil, tempfile, glob

          home = os.path.expanduser("~")
          cookies = []

          # --- source 1: persistent profile's saved cookies (freshest, decrypted) ---
          for p in ("agent/data/dice_cookies.json", "data/dice_cookies.json"):
              if os.path.exists(p):
                  try:
                      c = json.load(open(p))
                      cookies = [x for x in c if "dice.com" in (x.get("domain", "") or "")]
                      if cookies:
                          print(f"  ✅ source 1: {len(cookies)} dice cookies from {p}")
                          break
                  except Exception as e:
                      print(f"  ⚠️ {p}: {e}")

          # --- source 2: Chrome SQLite DB fallback ---
          if not cookies:
              paths = glob.glob(f"{home}/Library/Application Support/Google/Chrome/*/Cookies")
              for db in paths:
                  tmp = tempfile.mktemp(suffix=".db")
                  try:
                      shutil.copy2(db, tmp)
                      conn = sqlite3.connect(tmp)
                      for name, value, dom, path, sec in conn.execute(
                          "SELECT name,value,host_key,path,is_secure FROM cookies "
                          "WHERE host_key LIKE '%dice.com%'"):
                          if value:
                              cookies.append({"name": name, "value": value, "domain": dom,
                                              "path": path, "secure": bool(sec)})
                      conn.close()
                  except Exception as e:
                      print(f"  ⚠️ {db}: {e}")
                  finally:
                      try: os.unlink(tmp)
                      except OSError: pass
                  if cookies:
                      print(f"  ✅ source 2: {len(cookies)} dice cookies from Chrome DB")
                      break

          if not cookies:
              print("  ❌ No Dice cookies found. Re-login locally:")
              print("     cd agent && DICE_MANUAL_LOGIN=1 HEADFUL=1 python3 dice_apply.py")
              raise SystemExit(1)

          names = {c["name"] for c in cookies}
          # Dice session/auth cookies we want present
          has_session = any(n in names for n in ("DLI", "SERVERID", "_gd_session", "_gd_visitor"))
          print(f"  📋 {len(cookies)} cookies; session tokens present: {has_session}")

          encoded = base64.b64encode(json.dumps(cookies).encode()).decode()
          if len(encoded) > 48000:
              # trim to just the essential session cookies if too large for a GH secret
              essential = [c for c in cookies if c["name"] in
                           ("DLI", "SERVERID", "_gd_session", "_gd_visitor", "__ssid", "CMS_Cookie")]
              encoded = base64.b64encode(json.dumps(essential).encode()).decode()
              print(f"  ✂️  trimmed to {len(essential)} essential cookies ({len(encoded)}b)")

          r = subprocess.run(["gh", "secret", "set", "DICE_COOKIES", "--body", encoded,
                              "--repo", "BOBRIKH75/job-finder"], capture_output=True, text=True)
          if r.returncode == 0:
              print(f"  ✅ DICE_COOKIES refreshed ({len(cookies)} cookies) — auto every 3 days")
          else:
              print(f"  ❌ gh secret set failed: {r.stderr[:200]}")
              raise SystemExit(1)
          EOF

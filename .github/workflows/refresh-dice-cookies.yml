name: Refresh Dice Cookies (Auto)

# Keeps DICE_COOKIES fresh so the Dice apply flow never hits login_redirect.
# Opens the SAME persistent .dice-profile that dice_apply uses, refreshes the live Dice
# session, and exports fresh cookies to the DICE_COOKIES secret. Self-hosted (the profile
# with the login lives on that machine). No manual step ever.
on:
  schedule:
    - cron: "0 12 */3 * *"   # every 3 days, 6 AM MT (before the apply schedules)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: self-hosted
    timeout-minutes: 8
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - name: Refresh Dice session + update DICE_COOKIES secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'EOF'
          """Open the persistent .dice-profile (the one dice_apply logs into), visit dice.com
          to refresh the live session, export fresh dice.com cookies, and set DICE_COOKIES.
          The profile lives in the home-dir repo (gitignored), NOT this CI checkout — so we
          locate it by absolute path relative to this repo's known home location."""
          import json, os, base64, subprocess, glob, sys

          # locate the persistent profile dice_apply uses (home-dir repo, any user)
          prof = None
          for base in glob.glob(os.path.expanduser("~/Downloads/CV/job-finder/agent/.dice-profile")) + \
                       glob.glob("/Users/*/Downloads/CV/job-finder/agent/.dice-profile") + \
                       [os.path.abspath(".dice-profile")]:
              if os.path.isdir(base):
                  prof = base; break
          if not prof:
              print("❌ .dice-profile not found on this runner — run DICE_MANUAL_LOGIN=1 locally once."); sys.exit(1)
          print(f"  📂 using profile: {prof}")

          try:
              from patchright.sync_api import sync_playwright
          except Exception:
              from playwright.sync_api import sync_playwright

          cookies = []
          for l in ("SingletonLock", "SingletonCookie", "SingletonSocket"):
              try: os.unlink(os.path.join(prof, l))
              except OSError: pass
          with sync_playwright() as pw:
              try:
                  ctx = pw.chromium.launch_persistent_context(prof, channel="chrome", headless=True, no_viewport=True)
              except Exception:
                  ctx = pw.chromium.launch_persistent_context(prof, headless=True, no_viewport=True)
              pg = ctx.pages[0] if ctx.pages else ctx.new_page()
              try:
                  pg.goto("https://www.dice.com/dashboard/applications", wait_until="domcontentloaded", timeout=30000)
                  import time; time.sleep(4)
              except Exception as e:
                  print(f"  ⚠️ nav: {e}")
              url = pg.url or ""
              cookies = [c for c in ctx.cookies() if "dice.com" in (c.get("domain","") or "")]
              # also persist to the profile's cookie file for dice_apply reuse
              try:
                  os.makedirs(os.path.join(os.path.dirname(prof), "data"), exist_ok=True)
                  json.dump(ctx.cookies(), open(os.path.join(os.path.dirname(prof), "data", "dice_cookies.json"), "w"))
              except Exception: pass
              ctx.close()

          if "login" in url.lower():
              print("  ❌ profile session EXPIRED (redirected to login). Re-login once locally:")
              print("     cd agent && DICE_MANUAL_LOGIN=1 HEADFUL=1 python3 dice_apply.py")
              sys.exit(1)
          if not cookies:
              print("  ❌ no dice cookies from profile"); sys.exit(1)

          names = {c["name"] for c in cookies}
          print(f"  ✅ refreshed session — {len(cookies)} dice cookies; "
                f"session tokens: {any(n in names for n in ('DLI','SERVERID','_gd_session','_gd_visitor'))}")

          encoded = base64.b64encode(json.dumps(cookies).encode()).decode()
          if len(encoded) > 48000:
              essential = [c for c in cookies if c["name"] in
                           ("DLI","SERVERID","_gd_session","_gd_visitor","__ssid","CMS_Cookie")]
              encoded = base64.b64encode(json.dumps(essential).encode()).decode()
              print(f"  ✂️  trimmed to {len(essential)} essential cookies")

          r = subprocess.run(["gh","secret","set","DICE_COOKIES","--body",encoded,
                              "--repo","BOBRIKH75/job-finder"], capture_output=True, text=True)
          if r.returncode == 0:
              print(f"  ✅ DICE_COOKIES refreshed — auto every 3 days, fully dynamic")
          else:
              print(f"  ❌ gh secret set failed: {r.stderr[:200]}"); sys.exit(1)
          EOF

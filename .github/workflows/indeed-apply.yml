name: Indeed Easy Apply

on:
  schedule:
    # 24/7, every 2 hours on the hour. Weekday-only gating removed (jobs post nights/weekends).
    - cron: '0 */2 * * *'   # every 2h, 24/7
  workflow_dispatch: {}

concurrency:
  group: indeed-apply
  cancel-in-progress: false

defaults:
  run:
    working-directory: agent

permissions:
  contents: write

jobs:
  indeed-apply:
    runs-on: self-hosted  # MUST be self-hosted — Indeed cookies are IP-bound (cloud IP = instant expire)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Trust corporate SSL (fixes CERTIFICATE_VERIFY_FAILED on corp network)
        run: |
          security find-certificate -a -p /Library/Keychains/System.keychain > $GITHUB_WORKSPACE/.corp-roots.pem 2>/dev/null || true
          security find-certificate -a -p /System/Library/Keychains/SystemRootCertificates.keychain >> $GITHUB_WORKSPACE/.corp-roots.pem 2>/dev/null || true
          if [ -s $GITHUB_WORKSPACE/.corp-roots.pem ]; then
            echo "SSL_CERT_FILE=$GITHUB_WORKSPACE/.corp-roots.pem" >> $GITHUB_ENV
            echo "REQUESTS_CA_BUNDLE=$GITHUB_WORKSPACE/.corp-roots.pem" >> $GITHUB_ENV
            echo "certs: $(grep -c 'BEGIN CERT' $GITHUB_WORKSPACE/.corp-roots.pem || echo 0)"
          fi

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m pip install python-jobspy pandas browser-cookie3
          python3 -m playwright install chromium --with-deps || true

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Initialize database
        run: python3 -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Restore dedup state (pull latest applied-job records)
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Indeed Bot"
          git pull --rebase --autostash || true

      - name: Run Indeed applicator
        timeout-minutes: 25
        env:
          INDEED_COOKIES: ${{ secrets.INDEED_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOPECHA_API_KEY: ${{ secrets.NOPECHA_API_KEY }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ANSWERER_NO_ASK: '1'
          TARGET_SUBMITS: '15'
          RESULTS_WANTED: '50'
          INDEED_HOURS_OLD: '72'
          HEADFUL: '1'
          CLOUDFLARE_WAIT: '30'   # wait up to 30s for Turnstile to auto-pass (headful real
                                  # Chrome on the home residential IP auto-mints the token;
                                  # clicking a managed challenge from automation does not work)
        run: |
          cd $GITHUB_WORKSPACE/agent
          PYTHONUNBUFFERED=1 python3 -u submit_one.py

      - name: Save agent memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-indeed-${{ github.run_number }}

      - name: Commit dedup state + failed jobs (shared with local)
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Indeed Bot"
          git add agent/data/applied_jks.json agent/data/applied_titles.json \
                  agent/data/email_confirmed_titles.json agent/data/failed_jks.json \
                  agent/data/dead_jks.json \
                  agent/data/failed_jobs.json agent/data/indeed_manual_jobs.json \
                  agent/data/dice_manual_jobs.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "indeed: sync applied/dedup state [skip ci]"
          git pull --rebase --autostash || true
          git push || true

name: Indeed Easy Apply

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 8:00 AM MT (before Greenhouse 8:30)
    - cron: '0 16 * * 1-5'   # 10:00 AM MT (gap between Greenhouse 9:15 done and 11:30 start)
    - cron: '0 20 * * 1-5'   # 2:00 PM MT (before Greenhouse 2:30)
    - cron: '0 0 * * 1-5'    # 6:00 PM MT (gap after Greenhouse 6:15 done)
  workflow_dispatch: {}

concurrency:
  group: indeed-apply
  cancel-in-progress: false

defaults:
  run:
    working-directory: agent

permissions:
  contents: write

jobs:
  indeed-apply:
    runs-on: self-hosted  # MUST be self-hosted — Indeed cookies are IP-bound (cloud IP = instant expire)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m pip install python-jobspy pandas browser-cookie3
          python3 -m playwright install chromium --with-deps || true

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Initialize database
        run: python3 -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Run Indeed applicator
        timeout-minutes: 25
        env:
          INDEED_COOKIES: ${{ secrets.INDEED_COOKIES }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 indeed_apply.py

      - name: Save agent memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-indeed-${{ github.run_number }}

      - name: Commit failed jobs for solve-unsolved
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Indeed Bot"
          git add agent/data/failed_jobs.json agent/data/indeed_manual_jobs.json agent/data/dice_manual_jobs.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "indeed: save failed jobs for retry [skip ci]"
          git push || true

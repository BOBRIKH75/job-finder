name: "Vendor Outreach (Monthly)"

on:
  schedule:
    - cron: "0 16 1 * *"   # 1st of every month at 10:00 AM MT
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: agent

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send vendor outreach emails
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: python scripts/vendor_outreach.py

      - name: Save outreach history
        if: always()
        run: |
          git config user.email "bot@github.actions"
          git config user.name "Outreach Bot"
          git add ../data/vendor_outreach_history.json || true
          git diff --staged --quiet || git commit -m "chore: vendor outreach history $(date +%Y-%m-%d)"
          git push || true

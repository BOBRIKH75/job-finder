name: "Vendor Outreach (Monthly)"

on:
  schedule:
    - cron: "0 16 * * 2"   # weekly Tue 10 AM MT (30-day TTL prevents re-spam)
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: agent

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Send vendor outreach emails
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: python scripts/vendor_outreach.py

      - name: Save outreach history
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@github.actions"
          git config user.name "Outreach Bot"
          git add agent/data/vendor_outreach_history.json agent/data/vendor_list.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: vendor outreach history $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash || true
          git push || true

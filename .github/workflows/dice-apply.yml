name: Dice Easy Apply

on:
  schedule:
    - cron: '30 13 * * 1-5'  # 7:30 AM MT, weekdays
    - cron: '30 16 * * 1-5'  # 10:30 AM MT, weekdays
    - cron: '30 21 * * 1-5'  # 3:30 PM MT, weekdays
  workflow_dispatch: {}

concurrency:
  group: dice-apply
  cancel-in-progress: false

jobs:
  dice-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install setuptools selenium undetected-chromedriver webdriver-manager

      - name: Run Dice Easy Apply
        env:
          DICE_EMAIL: ${{ secrets.DICE_EMAIL }}
          DICE_PASSWORD: ${{ secrets.DICE_PASSWORD }}
        run: |
          if [ -z "$DICE_EMAIL" ]; then
            echo "⏭️ DICE_EMAIL not set — skipping"
            exit 0
          fi
          python3 << 'PYTHON'
          import os, time, random, json
          import undetected_chromedriver as uc
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          email = os.environ['DICE_EMAIL']
          password = os.environ['DICE_PASSWORD']
          MAX_APPS = 75

          options = uc.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1920,1080')

          # Detect Chrome version
          import subprocess, platform, re
          try:
              out = subprocess.check_output(['google-chrome', '--version']).decode()
              version_main = int(re.search(r'(\d+)\.', out).group(1))
              print(f'Chrome version: {version_main}')
          except Exception:
              version_main = None

          driver = uc.Chrome(options=options, version_main=version_main)
          wait = WebDriverWait(driver, 15)

          verified_applied = 0
          already_applied = 0
          failed = 0
          no_button = 0

          try:
              # === LOGIN ===
              driver.get('https://www.dice.com/dashboard/login')
              time.sleep(3)

              try:
                  email_input = wait.until(EC.presence_of_element_located(
                      (By.CSS_SELECTOR, '[name="email"], #email, input[type="email"]')))
                  email_input.send_keys(email)
                  time.sleep(1)

                  for btn in driver.find_elements(By.TAG_NAME, 'button'):
                      if 'continue' in btn.text.lower():
                          btn.click()
                          break
                  time.sleep(3)

                  pwd_input = wait.until(EC.presence_of_element_located(
                      (By.CSS_SELECTOR, '[name="password"], #password, input[type="password"]')))
                  pwd_input.send_keys(password)
                  time.sleep(1)

                  for btn in driver.find_elements(By.TAG_NAME, 'button'):
                      if 'sign in' in btn.text.lower():
                          btn.click()
                          break
                  time.sleep(5)
              except Exception as e:
                  print(f'❌ Login failed: {e}')
                  driver.quit()
                  exit(1)

              # === VERIFY LOGIN ===
              page_text = driver.page_source.lower()
              current_url = driver.current_url.lower()
              if 'dashboard' in current_url or 'profile' in page_text or 'job seeker' in page_text:
                  print('✅ Login verified — on dashboard')
              elif 'captcha' in page_text or 'verify' in page_text or 'robot' in page_text:
                  print('❌ Login blocked by CAPTCHA/verification — aborting')
                  print(f'   URL: {driver.current_url}')
                  driver.quit()
                  exit(1)
              elif 'login' in current_url:
                  print('❌ Login failed — still on login page')
                  driver.quit()
                  exit(1)
              else:
                  print(f'⚠️ Login status unclear — URL: {driver.current_url} — continuing')

              # === SEARCH & APPLY ===
              searches = [
                  'Java Developer contract remote',
                  'Java Spring Boot microservices contract',
                  'Senior Java Backend engineer remote',
                  'Java Kafka AWS developer contract',
                  'Spring Boot Kubernetes developer remote',
                  'Java API developer C2C contract',
              ]

              for query in searches:
                  if verified_applied >= MAX_APPS:
                      break

                  url = f'https://www.dice.com/jobs?q={query.replace(" ", "+")}&filters.easyApply=true&filters.postedDate=ONE'
                  driver.get(url)
                  time.sleep(5)

                  cards = driver.find_elements(By.CSS_SELECTOR, 'a[data-cy="card-title-link"]')
                  if not cards:
                      cards = driver.find_elements(By.CSS_SELECTOR, 'a[href*="/job-detail/"]')

                  print(f'\n🔍 "{query}" → {len(cards)} jobs listed')

                  for card in cards[:10]:
                      if verified_applied >= MAX_APPS:
                          break
                      job_title = card.text[:60] if card.text else "unknown"

                      try:
                          card.click()
                          time.sleep(3)

                          page_text = driver.page_source.lower()

                          # Already applied?
                          if 'already applied' in page_text or 'you applied' in page_text or 'applied on' in page_text:
                              already_applied += 1
                              print(f'    ⏭️ Already applied: {job_title}')
                              driver.back()
                              time.sleep(2)
                              continue

                          # Find Easy Apply button
                          apply_btn = None
                          for selector in ['button[data-cy="apply-btn-wm"]', 'button.btn-easy-apply']:
                              btns = driver.find_elements(By.CSS_SELECTOR, selector)
                              if btns:
                                  apply_btn = btns[0]
                                  break
                          if not apply_btn:
                              for btn in driver.find_elements(By.TAG_NAME, 'button'):
                                  if 'easy apply' in btn.text.lower():
                                      apply_btn = btn
                                      break
                          if not apply_btn:
                              no_button += 1
                              driver.back()
                              time.sleep(2)
                              continue

                          apply_btn.click()
                          time.sleep(3)

                          # Submit
                          submitted = False
                          for selector in ['button[data-cy="submit-btn"]', 'button.btn-submit']:
                              btns = driver.find_elements(By.CSS_SELECTOR, selector)
                              if btns:
                                  btns[0].click()
                                  submitted = True
                                  break
                          if not submitted:
                              for btn in driver.find_elements(By.TAG_NAME, 'button'):
                                  txt = btn.text.lower().strip()
                                  if txt in ['submit', 'submit application', 'apply now']:
                                      btn.click()
                                      submitted = True
                                      break
                          if not submitted:
                              failed += 1
                              print(f'    ❌ No submit button: {job_title}')
                              driver.back()
                              time.sleep(2)
                              continue

                          # === VERIFY ===
                          time.sleep(3)
                          post_page = driver.page_source.lower()

                          success_signals = [
                              'thank you', 'application received', 'successfully submitted',
                              'we received your application', 'application has been submitted',
                              'you have applied', 'thanks for applying', 'application sent',
                              'congratulations'
                          ]
                          failure_signals = [
                              'required field', 'please fill', 'invalid',
                              'something went wrong', 'try again', 'captcha'
                          ]

                          if any(sig in post_page for sig in success_signals):
                              verified_applied += 1
                              print(f'    ✅ VERIFIED ({verified_applied}/{MAX_APPS}): {job_title}')
                          elif any(sig in post_page for sig in failure_signals):
                              failed += 1
                              print(f'    ❌ Failed (form error): {job_title}')
                          elif 'already applied' in post_page:
                              already_applied += 1
                              print(f'    ⏭️ Already applied (post-submit): {job_title}')
                          else:
                              failed += 1
                              print(f'    ⚠️ Unverified (no confirmation): {job_title}')

                          time.sleep(random.uniform(5, 12))
                          driver.back()
                          time.sleep(2)

                      except Exception:
                          failed += 1
                          driver.back()
                          time.sleep(2)
                          continue

              # === REPORT ===
              print(f'\n{"="*50}')
              print(f'📊 Dice Results (VERIFIED):')
              print(f'  ✅ Applied (confirmed): {verified_applied}')
              print(f'  ⏭️ Already applied:     {already_applied}')
              print(f'  ❌ Failed:              {failed}')
              print(f'  ⚪ No apply button:     {no_button}')
              print(f'{"="*50}')

              if verified_applied == 0 and failed > 5:
                  print('\n⚠️ WARNING: 0 verified — Dice may be blocking automation')

          finally:
              driver.quit()
          PYTHON

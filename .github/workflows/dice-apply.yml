name: Dice Easy Apply

on:
  schedule:
    - cron: '30 16 * * 1-5'  # 10:30 AM MT, weekdays
  workflow_dispatch: {}

concurrency:
  group: dice-apply
  cancel-in-progress: false

jobs:
  dice-apply:
    # Dice works BETTER on GitHub cloud (ubuntu) - confirmed getting email confirmations.
    # Self-hosted Mac: Dice detects headless Chrome 151 and silently rejects.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install setuptools dice-apply selenium undetected-chromedriver webdriver-manager
          python3 -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()" || true

      - name: Run Dice Easy Apply
        env:
          DICE_EMAIL: ${{ secrets.DICE_EMAIL }}
          DICE_PASSWORD: ${{ secrets.DICE_PASSWORD }}
        run: |
          if [ -z "$DICE_EMAIL" ]; then
            echo "⏭️ DICE_EMAIL not set — skipping"
            exit 0
          fi
          python3 -c "
          import os, time, random, subprocess, re
          import undetected_chromedriver as uc
          from selenium.webdriver.common.by import By

          # Detect installed Chrome version to avoid mismatch
          import subprocess, re, platform
          try:
              if platform.system() == 'Darwin':
                  out = subprocess.check_output(['/Applications/Google Chrome.app/Contents/MacOS/Google Chrome', '--version']).decode()
              else:
                  out = subprocess.check_output(['google-chrome', '--version']).decode()
              version_main = int(re.search(r'(\d+)\.', out).group(1))
              print(f'Chrome version detected: {version_main}')
          except Exception:
              version_main = None
              print('Could not detect Chrome version')

          email = os.environ['DICE_EMAIL']
          password = os.environ['DICE_PASSWORD']
          MAX_APPS = 75  # matches cookie_agent.py dice limit

          options = uc.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          driver = uc.Chrome(options=options, version_main=version_main)
          applied = 0

          try:
              # Login — try multiple selectors with explicit waits
              driver.get('https://www.dice.com/dashboard/login')
              from selenium.webdriver.support.ui import WebDriverWait
              from selenium.webdriver.support import expected_conditions as EC
              wait = WebDriverWait(driver, 20)
              logged_in = False

              # Try NEW flow: name='email' → Continue → name='password' → Sign In
              try:
                  email_input = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[name=\"email\"], #email, input[type=\"email\"]')))
                  email_input.send_keys(email)
                  time.sleep(1)
                  for btn in driver.find_elements(By.TAG_NAME, 'button'):
                      if 'continue with email' in btn.text.lower():
                          btn.click()
                          break
                  time.sleep(3)
                  pwd_input = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[name=\"password\"], #password, input[type=\"password\"]')))
                  pwd_input.send_keys(password)
                  time.sleep(1)
                  for btn in driver.find_elements(By.TAG_NAME, 'button'):
                      if 'sign in' in btn.text.lower() or 'submit' in btn.get_attribute('type').lower():
                          btn.click()
                          break
                  logged_in = True
                  print('✅ Logged in to Dice (new flow)')
              except Exception:
                  pass

              # Fallback: reload and try old flow
              if not logged_in:
                  try:
                      driver.get('https://www.dice.com/dashboard/login')
                      email_input = wait.until(EC.presence_of_element_located((By.ID, 'email')))
                      email_input.send_keys(email)
                      pwd_input = wait.until(EC.presence_of_element_located((By.ID, 'password')))
                      pwd_input.send_keys(password)
                      driver.find_element(By.CSS_SELECTOR, 'button[type=submit]').click()
                      logged_in = True
                      print('✅ Logged in to Dice (old flow)')
                  except Exception as e:
                      print(f'❌ Both login flows failed: {e}')
                      raise

              time.sleep(5)

              # Search for Java contract jobs
              searches = ['Java Developer contract remote', 'Java Spring Boot C2C', 'Senior Java Backend remote']
              for i, query in enumerate(searches):
                  if applied >= MAX_APPS: break
                  driver.get(f'https://www.dice.com/jobs?q={query.replace(\" \", \"+\")}&filters.easyApply=true&filters.postedDate=THREE')
                  time.sleep(6)

                  # Try multiple selectors for job cards
                  cards = driver.find_elements(By.CSS_SELECTOR, 'a[data-cy=\"card-title-link\"]')
                  if not cards:
                      cards = driver.find_elements(By.CSS_SELECTOR, 'a[data-testid*=\"card-title\"], .card-title-link, a.job-card-title')
                  if not cards:
                      cards = driver.find_elements(By.CSS_SELECTOR, 'a[href*=\"/job-detail/\"]')
                  print(f'  🔍 \"{query}\" → {len(cards)} Easy Apply jobs')

                  for card in cards[:10]:
                      if applied >= MAX_APPS: break
                      try:
                          card.click()
                          time.sleep(3)
                          # Try multiple apply button selectors
                          apply_selectors = 'button[data-cy=\"apply-btn-wm\"], .btn-easy-apply, button.apply-button, button[data-testid*=\"apply\"], a[data-cy=\"apply-btn-wm\"]'
                          btns = driver.find_elements(By.CSS_SELECTOR, apply_selectors)
                          if not btns:
                              all_btns = driver.find_elements(By.TAG_NAME, 'button')
                              btns = [b for b in all_btns if 'apply' in b.text.lower()]
                          if not btns:
                              driver.back()
                              time.sleep(2)
                              continue
                          btns[0].click()
                          time.sleep(3)
                          # Try to confirm
                          confirm_selectors = 'button[data-cy=\"submit-btn\"], button.submit-application, button[data-testid*=\"submit\"], button[type=\"submit\"]'
                          confirms = driver.find_elements(By.CSS_SELECTOR, confirm_selectors)
                          if not confirms:
                              all_btns2 = driver.find_elements(By.TAG_NAME, 'button')
                              confirms = [b for b in all_btns2 if 'submit' in b.text.lower() or 'apply' in b.text.lower()]
                          if confirms:
                              confirms[0].click()
                              applied += 1
                              print(f'    ✅ Applied ({applied}/{MAX_APPS})')
                          time.sleep(random.uniform(5, 15))
                          driver.back()
                          time.sleep(2)
                      except Exception as e:
                          driver.back()
                          time.sleep(2)
                          continue

              print(f'📊 Dice: {applied} applications submitted')
          finally:
              driver.quit()
          "

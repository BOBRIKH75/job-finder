name: Tests & Lint

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes pytest pyyaml python-jobspy dnspython
          pip install -r agent/requirements.txt || echo "::warning::some agent requirements failed to install"

      - name: py_compile every python file
        run: python -m compileall -q $(git ls-files '*.py')

      - name: pyflakes - undefined names / syntax errors (e.g. missing import)
        run: |
          python -m pyflakes $(git ls-files '*.py') > pyflakes.txt || true
          cat pyflakes.txt
          if grep -E "undefined name|SyntaxError|invalid syntax|IndentationError" pyflakes.txt; then
            echo "::error::pyflakes found undefined names or syntax errors"; exit 1
          fi

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.y*ml')):
              try:
                  d = yaml.safe_load(open(f))
                  assert isinstance(d, dict) and 'jobs' in d, 'no jobs'
                  assert (True in d) or ('on' in d), 'no trigger'
                  for name, job in d['jobs'].items():
                      assert 'runs-on' in job or 'uses' in job, f'job {name}: no runs-on'
              except Exception as e:
                  bad += 1
                  print(f'::error file={f}::{e}')
          sys.exit(1 if bad else 0)
          PY

      - name: pytest (agent/tests)
        working-directory: agent
        run: python -m pytest -q --ignore=tests/test_captcha_live.py  # live browser tests

      - name: pytest (repo root)
        run: python -m pytest -q test_career_ops_scorer.py test_deep_search.py

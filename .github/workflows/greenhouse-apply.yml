name: Greenhouse Apply

# RE-ENABLED 2026-09-02: the reason it was disabled (applying to irrelevant jobs like
# Figma C++, DoorDash iOS, Toast Ruby) is now FIXED — greenhouse_apply.py has the
# cv_match CV-fit gate (Java/Spring/backend/remote/C2C, hard-negatives incl. C++/iOS/
# generic), round-robin company rotation, persistent+DB-lock dedup, and CV-driven
# discovery. Moderate cadence maximizes CV-fit applies without spamming.
on:
  schedule:
    # 24/7, every 2 hours at :15 (staggered off Indeed :00 and Dice :30). Greenhouse runs on
    # ubuntu-latest (cloud) by default, so continuous running does NOT depend on the laptop.
    # 30-day TTL dedup + round-robin rotation keep fresh reqs flowing.
    - cron: '15 */2 * * *'   # every 2h, 24/7
  workflow_dispatch: {}

concurrency:
  group: greenhouse-apply
  cancel-in-progress: false

defaults:
  run:
    working-directory: agent

jobs:
  greenhouse-apply:
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 50
    permissions:
      contents: write   # needed to push failed_jobs.json for retry

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          clean: true

      - name: Trust corporate SSL (fixes CERTIFICATE_VERIFY_FAILED on corp network)
        run: |
          security find-certificate -a -p /Library/Keychains/System.keychain > $GITHUB_WORKSPACE/.corp-roots.pem 2>/dev/null || true
          security find-certificate -a -p /System/Library/Keychains/SystemRootCertificates.keychain >> $GITHUB_WORKSPACE/.corp-roots.pem 2>/dev/null || true
          if [ -s $GITHUB_WORKSPACE/.corp-roots.pem ]; then
            echo "SSL_CERT_FILE=$GITHUB_WORKSPACE/.corp-roots.pem" >> $GITHUB_ENV
            echo "REQUESTS_CA_BUNDLE=$GITHUB_WORKSPACE/.corp-roots.pem" >> $GITHUB_ENV
            echo "certs: $(grep -c 'BEGIN CERT' $GITHUB_WORKSPACE/.corp-roots.pem || echo 0)"
          fi

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m playwright install chromium --with-deps || true

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Initialize database
        run: python3 -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Restore dedup state (pull latest applied records)
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Greenhouse Bot"
          git pull --rebase --autostash || true

      - name: Run Greenhouse applicator
        timeout-minutes: 45
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_SCAN_COUNT: "120"
          GH_DEDUP_DAYS: "14"
          MAX_POSTING_AGE_DAYS: "14"
        run: |
          cd $GITHUB_WORKSPACE
          python3 greenhouse_apply.py

      - name: Save agent memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-greenhouse-${{ github.run_number }}

      - name: Commit failed jobs for solve-unsolved
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Greenhouse Bot"
          git add agent/data/failed_jobs.json agent/data/greenhouse_applied.json agent/data/scan_offset.json agent/data/companies.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "greenhouse: sync applied/dedup/scan-offset/discovered-companies [skip ci]"
          git pull --rebase --autostash || true
          git push || true

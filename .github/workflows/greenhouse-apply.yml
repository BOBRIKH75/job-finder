name: Greenhouse Apply

# DISABLED: Applying to irrelevant jobs (Figma C++, DoorDash iOS, Toast, etc.)
# without Java/C2C filter. AI Agent already covers Greenhouse with proper
# relevance filtering. Re-enable after adding filter logic from agent.py.
on:
  # schedule DISABLED — was running 7x/day applying to wrong jobs:
  #   - cron: '30 14 * * *'
  #   - cron: '30 17 * * *'
  #   - cron: '30 20 * * *'
  #   - cron: '30 23 * * *'
  #   - cron: '30 4 * * *'
  #   - cron: '30 7 * * *'
  #   - cron: '30 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: greenhouse-apply
  cancel-in-progress: false

defaults:
  run:
    working-directory: agent

jobs:
  greenhouse-apply:
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 50
    permissions:
      contents: write   # needed to push failed_jobs.json for retry

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          clean: true

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m playwright install chromium --with-deps || true

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Initialize database
        run: python3 -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Restore dedup state (pull latest applied records)
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Greenhouse Bot"
          git pull --rebase --autostash || true

      - name: Run Greenhouse applicator
        timeout-minutes: 45
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd $GITHUB_WORKSPACE
          python3 greenhouse_apply.py

      - name: Save agent memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-greenhouse-${{ github.run_number }}

      - name: Commit failed jobs for solve-unsolved
        if: always()
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@bobrikh.dev"
          git config user.name "Greenhouse Bot"
          git add agent/data/failed_jobs.json agent/data/greenhouse_applied.json agent/data/scan_offset.json agent/data/companies.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "greenhouse: sync applied/dedup/scan-offset/discovered-companies [skip ci]"
          git pull --rebase --autostash || true
          git push || true

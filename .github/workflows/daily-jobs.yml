name: Daily C2C Job Search

on:
  schedule:
    - cron: '30 15 * * *'  # 9:30 AM Colorado (MDT)
  workflow_dispatch:

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-jobspy

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_jobs.json
            learned.json
            contacted.json
          key: job-data

      - name: Run job search + outreach
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python find_jobs.py

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
            learned.json
            contacted.json
          key: job-data-${{ github.run_number }}

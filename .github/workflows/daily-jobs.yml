name: Daily C2C Job Search

on:
  schedule:
    - cron: '30 15 * * *'  # 9:30 AM Colorado (MDT) — job search daily
    - cron: '0 14 * * 1,4'  # 8:00 AM Colorado Mon & Thu — LinkedIn posts
  workflow_dispatch:

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-jobspy

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_jobs.json
            learned.json
            contacted.json
            posted_topics.json
            found_jobs.json
          key: job-data

      - name: Run job search + outreach
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          python find_jobs.py
          python linkedin_deep_search.py

      - name: Generate LinkedIn posts (Mon & Thu only)
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
        run: python linkedin_posts.py

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
            learned.json
            contacted.json
            posted_topics.json
            found_jobs.json
          key: job-data-${{ github.run_number }}

      - name: Commit found_jobs.json for ai-job-agent
        if: always()
        run: |
          git config user.name "Bob Rikh"
          git config user.email "bobrikh75@gmail.com"
          git add found_jobs.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update found_jobs.json [skip ci]"
          git push || true

name: Daily C2C Job Search

on:
  schedule:
    - cron: '30 13 * * *'  # 7:30 AM MT — morning job search
    - cron: '30 19 * * *'  # 1:30 PM MT — afternoon job search (fresh postings)
    - cron: '0 14 * * 1,4'  # 8:00 AM MT Mon & Thu — LinkedIn posts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-jobspy dnspython pytest

      - name: Run tests
        run: python -m pytest test_deep_search.py -q

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_jobs.json
            learned.json
            contacted.json
            posted_topics.json
            found_jobs.json
            found_recruiters.json
            apply_report.json
          key: job-data

      - name: Run job search + outreach
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SNOV_USER_ID: ${{ secrets.SNOV_USER_ID }}
          SNOV_API_SECRET: ${{ secrets.SNOV_API_SECRET }}
          TOMBA_KEY: ${{ secrets.TOMBA_KEY }}
          TOMBA_SECRET: ${{ secrets.TOMBA_SECRET }}
        run: |
          python find_jobs.py
          python linkedin_deep_search.py
          python recruiter_search.py
          python -c "import outreach; outreach.send_followups(); outreach.send_reengagements()"

      - name: Generate LinkedIn posts (Mon & Thu only)
        continue-on-error: true
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
        run: python linkedin_posts.py

      - name: Email manual apply links
        if: always()
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
        run: |
          python -c "
          import json, os, subprocess, tempfile
          from datetime import datetime
          if not os.path.exists('apply_report.json'): exit(0)
          report = json.load(open('apply_report.json'))
          manual = report.get('not_applied_need_manual', [])
          if not manual: exit(0)
          rows = ''
          for j in manual[:30]:
              rows += f'<tr><td style=\"padding:6px 10px\"><b>{j[\"title\"]}</b><br><span style=\"color:#666\">{j[\"company\"]} | {j.get(\"location\",\"\")}</span></td><td style=\"padding:6px;text-align:center\"><a href=\"{j[\"url\"]}\" style=\"color:white;background:#e53935;padding:6px 12px;border-radius:4px;text-decoration:none;font-size:12px\">APPLY→</a></td></tr>'
          emailed = len(report.get('applied_via_email', []))
          html = f'<html><body style=\"font-family:Arial;max-width:700px;margin:0 auto\"><div style=\"background:#e53935;color:white;padding:15px;border-radius:8px 8px 0 0\"><h2 style=\"margin:0\">🎯 {len(manual)} Jobs Need YOUR Apply</h2><p style=\"margin:3px 0 0;opacity:0.9\">{datetime.now().strftime(\"%B %d %Y\")} | {emailed} already emailed to recruiters</p></div><div style=\"padding:10px;border:1px solid #ddd\"><table style=\"border-collapse:collapse;width:100%\" border=\"1\" bordercolor=\"#eee\"><tr style=\"background:#333;color:white\"><th style=\"padding:8px;text-align:left\">Job</th><th style=\"padding:8px;width:70px\">Action</th></tr>{rows}</table></div></body></html>'
          payload = json.dumps({'from':'Job Agent <onboarding@resend.dev>','to':['bobrikh75@gmail.com'],'subject':f\"🎯 {len(manual)} Jobs — Apply Now (no recruiter found) — {datetime.now().strftime('%b %d')}\", 'html': html})
          with tempfile.NamedTemporaryFile(mode='w',suffix='.json',delete=False) as f: f.write(payload); tmp=f.name
          subprocess.run(['curl','-s','-X','POST','https://api.resend.com/emails','-H',f'Authorization: Bearer {os.environ[\"RESEND_KEY\"]}','-H','Content-Type: application/json','-d',f'@{tmp}'],capture_output=True,timeout=30)
          os.unlink(tmp)
          print(f'📧 Sent {len(manual)} manual-apply links to email')
          "

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
            learned.json
            contacted.json
            posted_topics.json
            found_jobs.json
            found_recruiters.json
            apply_report.json
          key: job-data-${{ github.run_number }}

      - name: Commit found_jobs.json for ai-job-agent
        if: always()
        run: |
          git config user.name "Bob Rikh"
          git config user.email "bobrikh75@gmail.com"
          git add found_jobs.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update found_jobs.json [skip ci]"
          git push || true

      - name: Resolve LinkedIn URLs to company apply pages
        if: success()
        continue-on-error: true
        env:
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
        run: |
          python resolve_urls.py
          git add found_jobs.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Resolve LinkedIn URLs to apply pages [skip ci]"
          git push || true

      - name: Trigger auto-apply agent
        if: success()
        run: |
          JOBS_COUNT=$(python3 -c "import json,os; print(json.load(open('found_jobs.json')).get('count',0)) if os.path.exists('found_jobs.json') else print(0)")
          if [ "$JOBS_COUNT" -gt 0 ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type":"jobs-found"}'
            echo "🚀 Triggered auto-apply agent ($JOBS_COUNT jobs found)"
          else
            echo "⏭️ No jobs found — skipping agent trigger"
          fi

name: Solve Unsolved Jobs

on:
  schedule:
    - cron: '30 1 * * *'    # 7:30 PM MT
    - cron: '30 3 * * *'    # 9:30 PM MT
    - cron: '30 5 * * *'    # 11:30 PM MT
    - cron: '30 7 * * *'    # 1:30 AM MT
    - cron: '30 9 * * *'    # 3:30 AM MT
    - cron: '30 11 * * *'   # 5:30 AM MT
    - cron: '30 13 * * *'   # 7:30 AM MT
    - cron: '30 15 * * *'   # 9:30 AM MT
    - cron: '30 17 * * *'   # 11:30 AM MT
    - cron: '30 19 * * *'   # 1:30 PM MT
    - cron: '30 21 * * *'   # 3:30 PM MT
    - cron: '30 23 * * *'   # 5:30 PM MT
  workflow_dispatch: {}

concurrency:
  group: solve-unsolved
  cancel-in-progress: false

defaults:
  run:
    working-directory: agent

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Restore solver data
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            agent/data/unsolved_jobs.json
            agent/data/learned_strategies.json
            agent/data/solve_attempts.json
          key: solver-data
          restore-keys: solver-data

      - name: Check for unsolved jobs
        id: check
        run: |
          if [ -f data/unsolved_jobs.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('data/unsolved_jobs.json'))))")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "📋 Found $COUNT unsolved jobs"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "📋 No unsolved_jobs.json found"
          fi

      - name: Run solver (up to 5 jobs)
        if: steps.check.outputs.count != '0'
        continue-on-error: true
        run: python solve_one_job.py --max-jobs 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save solver data
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            agent/data/unsolved_jobs.json
            agent/data/learned_strategies.json
            agent/data/solve_attempts.json
          key: solver-data-${{ github.run_number }}

      - name: Commit learned strategies
        if: always()
        continue-on-error: true
        run: |
          cd ..
          git config user.name "Job Solver Bot"
          git config user.email "bot@users.noreply.github.com"
          git add agent/data/learned_strategies.json agent/data/unsolved_jobs.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "solver: update learned strategies [skip ci]"
          git push || true

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: solver-screenshots-${{ github.run_number }}
          path: agent/screenshots/solve_*.png
          retention-days: 1
          if-no-files-found: ignore

name: "Recruiter Discovery (Daily)"

on:
  schedule:
    - cron: "0 13 * * *"   # 7:00 AM MT daily
  workflow_dispatch: {}

defaults:
  run:
    working-directory: agent

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Find recruiters from OUR applications (reliable source)
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SNOV_USER_ID: ${{ secrets.SNOV_USER_ID }}
          SNOV_API_SECRET: ${{ secrets.SNOV_API_SECRET }}
        run: python scripts/recruiter_from_applications.py

      - name: Harvest REAL recruiters from inbox (free, no API)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/recruiter_from_inbox.py

      - name: Mine MORE jobs from recruiter emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/jobs_from_recruiter_emails.py

      - name: Commit new vendors
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@github.actions"
          git config user.name "Recruiter Discovery Bot"
          git add agent/data/vendor_list.json agent/data/applied_companies.json agent/data/recruiter_job_leads.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "recruiter: sync new contacts [skip ci]"
          git pull --rebase --autostash || true
          git push || true

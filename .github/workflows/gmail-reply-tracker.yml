name: "Gmail Reply Tracker + Pipeline (Daily)"

on:
  schedule:
    - cron: "0 18 * * *"   # 12:00 PM MT daily
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: agent

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for recruiter replies (basic)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/gmail_reply_tracker.py

      - name: Smart reply classification + pipeline tracking
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/smart_reply_tracker.py

      - name: Organize Gmail into folders
        timeout-minutes: 3
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/gmail_organizer.py || echo "⚠️ Organizer timed out — will retry next run"

      - name: Save pipeline state
        if: always()
        run: |
          git config user.email "bot@github.actions"
          git config user.name "Reply Tracker Bot"
          git add ../contacted.json data/apollo_contacted.json data/interview_pipeline.json data/reply_log.json ../data/reply_tracker_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "pipeline: reply tracker update $(date +%Y-%m-%d) [skip ci]"
          git push || true

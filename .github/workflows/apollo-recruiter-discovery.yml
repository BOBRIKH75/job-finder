name: "Apollo Recruiter Discovery + Outreach (Weekly)"

on:
  schedule:
    # Every Monday at 9:00 AM MT (15:00 UTC)
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: agent

jobs:
  apollo-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Find recruiters via Apollo API (by company) — no cookies/TTL/ban
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/apollo_api_recruiters.py

      - name: Commit results
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@github.actions"
          git config user.name "Apollo Recruiter Bot"
          git add agent/data/vendor_list.json agent/data/apollo_api_seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "apollo: +recruiters via API $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin master || true
          if [ -n "$GH_PAT" ]; then
            git push "https://x-access-token:${GH_PAT}@github.com/BOBRIKH75/job-finder.git" HEAD:master || true
          else
            git push || true
          fi

      - name: Upload outreach log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-outreach-log-${{ github.run_id }}
          path: agent/data/apollo_outreach_log.json
          retention-days: 30

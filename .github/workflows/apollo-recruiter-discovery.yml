name: "Apollo Recruiter Discovery + Outreach (Weekly)"

on:
  schedule:
    # Every Monday at 9:00 AM MT (15:00 UTC)
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: agent

jobs:
  apollo-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install selenium webdriver-manager requests

      - name: Run Apollo scraper + outreach
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          APOLLO_EMAIL: ${{ secrets.APOLLO_EMAIL }}
          APOLLO_PASSWORD: ${{ secrets.APOLLO_PASSWORD }}
          APOLLO_COOKIES_B64: ${{ secrets.APOLLO_COOKIES_B64 }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: python scripts/apollo_outreach.py

      - name: Commit results
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          git config user.email "bot@github.actions"
          git config user.name "Apollo Recruiter Bot"
          git add agent/data/apollo_recruiters.json agent/data/apollo_contacted.json agent/data/apollo_outreach_log.json agent/data/vendor_list.json agent/data/apollo_cookies.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "apollo: +recruiters discovered, outreach sent $(date +%Y-%m-%d) [skip ci]"
          git push || true

      - name: Upload outreach log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-outreach-log-${{ github.run_id }}
          path: agent/data/apollo_outreach_log.json
          retention-days: 30

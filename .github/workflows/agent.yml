name: AI Job Agent — Daily Run

on:
  schedule:
    - cron: '0 16 * * *'  # 10:00 AM MT — after job-finder
  workflow_dispatch: {}

defaults:
  run:
    working-directory: agent

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth httpx resend pydantic beautifulsoup4 python-jobspy pandas pytest
          playwright install chromium --with-deps

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Initialize database
        run: python -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Copy found_jobs.json from finder
        run: cp ../found_jobs.json found_jobs.json 2>/dev/null || echo '{"jobs":[],"count":0}' > found_jobs.json

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_applier.py

      - name: Run agent (full pipeline — find, filter, apply, email)
        run: python agent.py --cloud
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}

      - name: Save agent memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-${{ github.run_number }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: agent/screenshots/
          retention-days: 7

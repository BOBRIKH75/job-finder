name: AI Job Agent — Daily Run

on:
  schedule:
    - cron: '0 16 * * *'    # 10:00 AM MT — main run (1x/day to stay in free tier)
  workflow_dispatch: {}
  repository_dispatch:
    types: [jobs-found]

defaults:
  run:
    working-directory: agent

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install playwright playwright-recaptcha seleniumbase curl_cffi camoufox httpx resend pydantic beautifulsoup4 python-jobspy pandas pytest requests cloudscraper cloakbrowser dnspython
          sudo apt-get install -y ffmpeg
          playwright install chromium --with-deps
          python -c "import cloakbrowser; cloakbrowser.download()" || true
          python -c "from camoufox.sync_api import Camoufox; print('camoufox OK')" || true

      - name: Start OhMyCaptcha solver (background)
        run: |
          git clone --depth 1 https://github.com/shenhao-stu/ohmycaptcha.git /tmp/ohmycaptcha
          pip install -r /tmp/ohmycaptcha/requirements.txt -q
          cd /tmp/ohmycaptcha && python main.py &
          sleep 3
          curl -s http://localhost:8000/api/v1/health || echo "OhMyCaptcha not ready (non-blocking)"
        env:
          CLOUD_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
          CLOUD_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUD_MODEL: "gemini-2.0-flash"
          CLIENT_KEY: "job-agent"
          BROWSER_HEADLESS: "true"

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Initialize database
        run: python -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Get found_jobs.json
        working-directory: .
        run: |
          if [ -f found_jobs.json ]; then
            cp found_jobs.json agent/found_jobs.json
            echo "Copied from repo root"
          else
            echo "Searching ALL job boards..."
            pip install python-jobspy 2>/dev/null
            python3 << 'PYSCRIPT'
          import json
          from jobspy import scrape_jobs
          all_jobs = []
          for q in [
            'Senior Java Developer contract remote',
            'Java Spring Boot Developer C2C remote',
            'Senior Software Engineer Java contract',
            'Java Backend Developer contract remote',
            'Java Microservices Developer contract',
            'Java Kafka Developer contract remote',
            'Software Engineer Java Spring Boot remote',
            'Java Developer corp-to-corp C2C',
            'Java Kubernetes Docker AWS contract',
            'Senior Backend Engineer Java contract',
            'Java Full Stack Developer contract remote',
            ]:
              try:
                  jobs = scrape_jobs(site_name=['google','indeed','linkedin','glassdoor','zip_recruiter'], google_search_term=q+' jobs apply', search_term=q, location='USA', results_wanted=15, hours_old=336)
                  for _, r in jobs.iterrows():
                      url = str(r.get('job_url',''))
                      if not url:
                          continue
                      # Use company career page if available, otherwise keep original URL
                      company_url = str(r.get('company_url',''))
                      if company_url and company_url != 'nan' and company_url.startswith('http'):
                          url = company_url
                      all_jobs.append({'title':str(r.get('title','')),'company':str(r.get('company','')),'url':url,'location':str(r.get('location','')),'description':str(r.get('description',''))[:1000],'source':str(r.get('site',''))})
                  print(f'  "{q[:40]}" -> {len(jobs)} results')
              except Exception as e:
                  print(f'  Error: {e}')
          seen = set()
          unique = [j for j in all_jobs if j['url'] not in seen and not seen.add(j['url'])]
          with open('agent/found_jobs.json','w') as f:
              json.dump({'jobs':unique,'count':len(unique)},f)
          print(f'Found {len(unique)} jobs from all sources (Indeed/LinkedIn redirected to company pages)')
          PYSCRIPT
          fi
          echo "Jobs: $(python3 -c 'import json;print(json.load(open("agent/found_jobs.json")).get("count",0))')"

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_applier.py --ignore=tests/test_bridge.py --ignore=tests/test_stealth_toolkit.py --ignore=tests/test_captcha_live.py

      - name: Run scorer tests
        working-directory: .
        run: python -m pytest test_career_ops_scorer.py -q

      - name: Run agent (full pipeline)
        continue-on-error: true
        run: python agent.py --cloud
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OHMYCAPTCHA_URL: "http://localhost:8000"
          OHMYCAPTCHA_KEY: "job-agent"
          INDEED_COOKIES: ${{ secrets.INDEED_COOKIES }}

      - name: Save agent memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-${{ github.run_number }}

      - name: Cleanup old screenshots (keep last 20)
        if: always()
        run: |
          cd screenshots/ 2>/dev/null || exit 0
          ls -t *.png 2>/dev/null | tail -n +21 | xargs rm -f || true
          echo "Screenshots kept: $(ls *.png 2>/dev/null | wc -l)"

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: agent/screenshots/
          retention-days: 1
          if-no-files-found: ignore

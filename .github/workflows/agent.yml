name: AI Job Agent — Daily Run

on:
  schedule:
    - cron: '0 13 * * *'    # 7:00 AM MT
    - cron: '0 16 * * *'   # 10:00 AM MT
    - cron: '0 19 * * *'   # 1:00 PM MT
    - cron: '0 22 * * *'   # 4:00 PM MT
  workflow_dispatch: {}
  repository_dispatch:
    types: [jobs-found]

concurrency:
  group: job-agent
  cancel-in-progress: false

defaults:
  run:
    working-directory: agent

jobs:
  run-agent:
    # Prefer self-hosted (your laptop = residential IP, better success rate)
    # Falls back to ubuntu-latest if offline (GitHub auto-picks available runner)
    runs-on: ${{ vars.PREFER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m playwright install chromium --with-deps || true

      - name: Start OhMyCaptcha solver (background)
        run: |
          echo "⏭️ OhMyCaptcha disabled — using free anchor/reload solver instead"
          echo "This saves 5+ minutes of Chromium install time"

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Restore rate limits
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/rate_limits.json
          key: rate-limits
          restore-keys: rate-limits

      - name: Initialize database
        run: python3 -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Get found_jobs.json
        working-directory: .
        run: |
          if [ -f found_jobs.json ]; then
            cp found_jobs.json agent/found_jobs.json
            echo "Copied from repo root"
          else
            echo "Searching ALL job boards..."
            python3 -m pip install python-jobspy 2>/dev/null
            python3 << 'PYSCRIPT'
          import json
          from jobspy import scrape_jobs
          all_jobs = []
          for q in [
            'Senior Java Developer contract remote',
            'Java Spring Boot Developer C2C remote',
            'Senior Software Engineer Java contract',
            'Java Backend Developer contract remote',
            'Java Microservices Developer contract',
            'Java Kafka Developer contract remote',
            'Software Engineer Java Spring Boot remote',
            'Java Developer corp-to-corp C2C',
            'Java Kubernetes Docker AWS contract',
            'Senior Backend Engineer Java contract',
            'Java Full Stack Developer contract remote',
            ]:
              try:
                  jobs = scrape_jobs(site_name=['google','indeed','linkedin','glassdoor','zip_recruiter'], google_search_term=q+' jobs apply', search_term=q, location='USA', results_wanted=15, hours_old=72)
                  for _, r in jobs.iterrows():
                      url = str(r.get('job_url',''))
                      if not url:
                          continue
                      # Use job_url (the actual job listing). company_url is often just a profile page.
                      all_jobs.append({'title':str(r.get('title','')),'company':str(r.get('company','')),'url':url,'location':str(r.get('location','')),'description':str(r.get('description',''))[:1000],'source':str(r.get('site',''))})
                  print(f'  "{q[:40]}" -> {len(jobs)} results')
              except Exception as e:
                  print(f'  Error: {e}')
          seen = set()
          unique = [j for j in all_jobs if j['url'] not in seen and not seen.add(j['url'])]
          with open('agent/found_jobs.json','w') as f:
              json.dump({'jobs':unique,'count':len(unique)},f)
          print(f'Found {len(unique)} jobs from all sources (Indeed/LinkedIn redirected to company pages)')
          PYSCRIPT
          fi
          echo "Jobs: $(python3 -c 'import json;print(json.load(open("agent/found_jobs.json")).get("count",0))')"

      - name: Run tests
        run: python3 -m pytest tests/ -q --ignore=tests/test_applier.py --ignore=tests/test_bridge.py --ignore=tests/test_stealth_toolkit.py --ignore=tests/test_captcha_live.py

      - name: Run scorer tests
        working-directory: .
        run: python3 -m pytest test_career_ops_scorer.py -q

      - name: Preflight — verify all API keys present
        run: |
          MISSING=""
          [ -z "$GEMINI_API_KEY" ] && MISSING="$MISSING GEMINI_API_KEY"
          [ -z "$GMAIL_USER" ] && MISSING="$MISSING GMAIL_USER"
          [ -z "$GMAIL_APP_PASSWORD" ] && MISSING="$MISSING GMAIL_APP_PASSWORD"
          [ -z "$HUNTER_API_KEY" ] && MISSING="$MISSING HUNTER_API_KEY"
          [ -z "$RESEND_KEY" ] && MISSING="$MISSING RESEND_KEY"
          if [ -n "$MISSING" ]; then
            echo "⚠️ MISSING ENV VARS:$MISSING — some features disabled"
          else
            echo "✅ All API keys present"
          fi

      - name: Run agent (full pipeline)
        continue-on-error: true
        timeout-minutes: 55
        run: python3 agent.py --cloud
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          SNOV_USER_ID: ${{ secrets.SNOV_USER_ID }}
          SNOV_API_SECRET: ${{ secrets.SNOV_API_SECRET }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          NOPECHA_API_KEY: ${{ secrets.NOPECHA_API_KEY }}
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          OHMYCAPTCHA_URL: "http://localhost:8000"
          OHMYCAPTCHA_KEY: "job-agent"
          INDEED_COOKIES: ${{ secrets.INDEED_COOKIES }}

      - name: Save agent memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-${{ github.run_number }}

      - name: Save rate limits
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: agent/data/rate_limits.json
          key: rate-limits-${{ github.run_number }}

      - name: Cleanup old screenshots (keep last 20)
        if: always()
        run: |
          cd screenshots/ 2>/dev/null || exit 0
          ls -t *.png 2>/dev/null | tail -n +21 | xargs rm -f || true
          echo "Screenshots kept: $(ls *.png 2>/dev/null | wc -l)"

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: agent/screenshots/
          retention-days: 1
          if-no-files-found: ignore

name: AI Job Agent — Daily Run

on:
  schedule:
    - cron: '0 16 * * *'  # 10:00 AM MT — runs AFTER job-finder (9:30 AM)
  workflow_dispatch: {}

defaults:
  run:
    working-directory: agent

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore agent memory
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-${{ github.run_number }}
          restore-keys: agent-memory-

      - name: Initialize database
        run: python -c "from src.memory import get_db, init_db; db = get_db(); init_db(db)"

      - name: Copy found_jobs.json from finder
        run: cp ../found_jobs.json found_jobs.json 2>/dev/null || echo '{"jobs":[],"count":0}' > found_jobs.json
        working-directory: agent

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run agent
        run: python agent.py --cloud
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}

      - name: Save agent memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory-${{ github.run_number }}

name: LinkedIn Easy Apply (Safe Mode)

on:
  schedule:
    - cron: '0 15 * * 1-5'  # 9:00 AM MT, weekdays only (one session — 20h cooldown enforced in script)
  workflow_dispatch: {}

concurrency:
  group: linkedin-apply
  cancel-in-progress: false

jobs:
  linkedin-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install setuptools selenium undetected-chromedriver webdriver-manager python-jobspy pandas

      - name: Run LinkedIn Easy Apply (SAFE limits)
        env:
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: |
          python linkedin_easy_apply.py

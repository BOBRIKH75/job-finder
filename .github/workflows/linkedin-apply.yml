name: LinkedIn Easy Apply (Safe Mode)

on:
  schedule:
    - cron: '0 15 * * 1-5'  # 9:00 AM MT, weekdays only (one session — 20h cooldown enforced in script)
  workflow_dispatch: {}

concurrency:
  group: linkedin-apply
  cancel-in-progress: false

jobs:
  linkedin-apply:
    # Uses ubuntu-latest until self-hosted runner is set up
    # After running setup-self-hosted-runner.sh, change to: [self-hosted, macOS, linkedin]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install setuptools selenium undetected-chromedriver webdriver-manager python-jobspy pandas

      - name: Run LinkedIn Easy Apply (SAFE limits)
        env:
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python linkedin_easy_apply.py

      - name: Persist applied job state (prevent re-applying)
        if: always()
        run: |
          git config user.email "bot@bobrikh.dev"
          git config user.name "LinkedIn Bot"
          git add linkedin_applied.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update LinkedIn applied IDs [skip ci]"
          git push || true

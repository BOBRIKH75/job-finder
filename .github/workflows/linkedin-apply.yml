name: LinkedIn Easy Apply (Safe Mode)

on:
  schedule:
    - cron: '0 15 * * 1-5'  # 9:00 AM MT, weekdays only (one session — 20h cooldown enforced in script)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: linkedin-apply
  cancel-in-progress: false

jobs:
  linkedin-apply:
    # Prefer self-hosted (your laptop = residential IP, trusted by LinkedIn)
    # Falls back to ubuntu-latest if self-hosted runner is offline
    runs-on: [self-hosted, macOS, linkedin]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'

      - name: Trust corporate SSL (fixes CERTIFICATE_VERIFY_FAILED on self-hosted/corp network)
        run: |
          # Corporate networks (e.g. Charter) do SSL inspection with a self-signed root.
          # Export the macOS system trust so Python/driver downloads verify correctly.
          security find-certificate -a -p /Library/Keychains/System.keychain > $GITHUB_WORKSPACE/.corp-roots.pem 2>/dev/null || true
          security find-certificate -a -p /System/Library/Keychains/SystemRootCertificates.keychain >> $GITHUB_WORKSPACE/.corp-roots.pem 2>/dev/null || true
          echo "SSL_CERT_FILE=$GITHUB_WORKSPACE/.corp-roots.pem" >> $GITHUB_ENV
          echo "REQUESTS_CA_BUNDLE=$GITHUB_WORKSPACE/.corp-roots.pem" >> $GITHUB_ENV
          echo "certs: $(grep -c 'BEGIN CERT' $GITHUB_WORKSPACE/.corp-roots.pem || echo 0)"

      - name: Install dependencies
        run: |
          python3 -m venv $GITHUB_WORKSPACE/.venv || true
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          source $GITHUB_WORKSPACE/.venv/bin/activate || true
          python3 -m pip install setuptools selenium undetected-chromedriver webdriver-manager python-jobspy pandas
          # Ensure chromedriver matches installed Chrome version
          python3 -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()" || true

      - name: Run LinkedIn Easy Apply (SAFE limits)
        env:
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Manual "Run workflow" bypasses the business-hours gate; scheduled runs stay gated.
          LINKEDIN_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python3 linkedin_easy_apply.py

      - name: Persist applied job state (prevent re-applying)
        if: always()
        run: |
          git config user.email "bot@bobrikh.dev"
          git config user.name "LinkedIn Bot"
          git add linkedin_applied.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update LinkedIn applied IDs [skip ci]"
          git pull --rebase --autostash origin master || true
          git push || true

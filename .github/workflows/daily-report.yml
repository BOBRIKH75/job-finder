name: Daily Report

on:
  schedule:
    - cron: '0 3 * * *'   # 9:00 PM MT (UTC-6) = 3:00 AM UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill all existing emails (2 years)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install httpx

      - name: Restore agent memory (for DB stats)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: agent/data/agent_memory.db
          key: agent-memory
          restore-keys: agent-memory

      - name: Organize Gmail inbox
        working-directory: agent
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            echo "Running BACKFILL mode — all emails since 2024"
            python scripts/gmail_organizer.py --backfill
          else
            python scripts/gmail_organizer.py
          fi
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Send daily report
        working-directory: agent
        run: |
          python scripts/application_confirmations.py
          python scripts/daily_report.py
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
